# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: CESM Tutorial (Union HPC edition)
author: NCAR/CGD Staff; adapted for Union College HPC by Osamu Miyawaki
logo: images/ncar_logo.png

sphinx:
  config:
    html_show_copyright: false

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
#execute:
#  execute_notebooks: force

execute:
  execute_notebooks: 'off'

# Repository notes and helper scripts are not pages of the book.
exclude_patterns:
  - PROVENANCE.md
  - tools/*
  - _build
  - '**.ipynb_checkpoints'
  - archive/*
  - archive/**


# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: tutorial_book.tex

# Add a bibtex file so that we can create citations
#bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/omiyawaki/cesm-tutorial-uhpc  # Union HPC adaptation; upstream is https://github.com/NCAR/CESM-Tutorial
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_repository_button: true
  use_edit_page_button : false
  use_issues_button    : true
  home_page_in_navbar  : true
  use_multitoc_numbering    : true
  extra_navbar              : ""
  announcement              : 'This is the CESM2.1.x tutorial adapted for Union College HPC (UHPC) from the <a href="https://ncar.github.io/CESM-Tutorial/">NCAR CESM Tutorial</a> (<a href="https://github.com/NCAR/CESM-Tutorial">source</a>, MIT License). Start with the page "Over break: what to do, in order".'


launch_buttons:
  binder             : false
  binderhub          : false
    #binderhub_url: https://mybinder.org
  jupyterhub         : false
  thebe              : false
  colab              : false


